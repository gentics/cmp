<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }} - {{ .Title }}</title>
    
    <!-- Common Styles: Colors, Fonts, Header, Footer -->
    <link href="https://www.gentics.com/static/css/common.css" media="screen" rel="stylesheet">

    <!-- Docs/Guides Specific styles -->
    {{ $stylesheets := .Params.stylesheet }}
    {{ if not $stylesheets }}{{ $stylesheets = slice "docs.css" }}{{ end }}
    {{ if not (reflect.IsSlice $stylesheets) }}{{ $stylesheets = slice $stylesheets }}{{ end }}
    {{ range $stylesheets }}
    <link href="/styles/{{ . }}" media="screen" rel="stylesheet">
    {{ end }}

    <script>
        window.major_version = "{{ .Site.Params.cmpversion }}";
    </script>
</head>
