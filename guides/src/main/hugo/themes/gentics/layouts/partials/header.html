<!-- Header -->
<header>
    <div class="container">
        <div class="header-content">
            <!-- Brand -->
            <div class="brand">
                <a href="https://www.gentics.com/infoportal"><img src="https://www.gentics.com/static/logos/gentics-logo-primaryblue.jpg" alt="Gentics Logo" class="brand-logo"></a>
                <span class="brand-headline">{{ .Site.Title }}</span>
            </div>

            <div class="header-actions">

               <button class="search-toggle" aria-label="Open search" aria-expanded="false" aria-controls="search-overlay">
                    <span class="search-icon" aria-hidden="true">🔍</span>
                </button>

                <!-- Mobile Menu Toggle -->
                <button class="mobile-menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="main-nav">
                    <span class="hamburger-icon" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                    </span>
                </button>
            </div>
        </div>
    </div>
</header>
