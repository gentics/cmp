languageCode = "en-us"
title = "Gentics CMP - Guides"
baseURL = "https://www.gentics.com/guides/"
theme = "gentics"

DefaultContentLanguage = "en-us"

relativeURLs = true
canonifyurls = true
enableRobotsTXT = true
publishDir = "output" # if you use GitHub to deploy
disableKinds = ["RSS"]
uglyURLs = true # we want ugly urls because otherwise hugo generates for every doc.adoc file a doc/index.html instead of just a doc.html. This leads to errors with images / includes and local preview

pluralizeListTitles = false

[security]
  [security.exec]
    allow = ["asciidoctor"]


#dont set workingFolderCurrent=true - otherwise images won't work anymore, use includes with absolute path
[markup]
  [markup.asciidocExt]
    [markup.asciidocExt.attributes]
      imagesdir = "."

[outputs]
  home = ["HTML", "JSON"]

