{{- if and .Values.persistence.enabled (not .Values.persistence.shared.existingClaim) }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: shared-{{ include "gentics-portal.fullname" . }}

  labels:
    {{- include "gentics-portal.labels" . | nindent 4 }}

  {{- with .Values.persistence.shared.annotations }}
  annotations:
    {{ toYaml . }}
  {{- end }}

spec:
  {{- toYaml .Values.persistence.shared.spec | nindent 2 }}
{{- end }}
