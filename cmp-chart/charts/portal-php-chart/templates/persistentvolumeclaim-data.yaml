{{- if and .Values.persistence.enabled (not .Values.persistence.data.existingClaim) (eq (.Values.replicaCount | int) 1) }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: data-{{ include "gentics-portal.fullname" . }}

  labels:
    {{- include "gentics-portal.labels" . | nindent 4 }}

  {{- with .Values.persistence.data.annotations }}
  annotations:
    {{ toYaml . }}
  {{- end }}

spec:
  {{- toYaml .Values.persistence.data.spec | nindent 2 }}
{{- end }}
