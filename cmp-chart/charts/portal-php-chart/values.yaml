# Default values for gentics-portal.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

autoscaling:
  enabled: false
  maxReplicas: 10
  minReplicas: 3
  targetCPUUtilizationPercentage: 80

image:
  # The portal | php has no pre-built image. A CI job needs to be setup to provide the image.
  # Reference the image which you build here
  #repository: docker.gentics.com/YOUR_ID/PROJECT-portal
  tag: 1.3.5
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  useHttp2: false

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx # Kubernetes <1.19
    # kubernetes.io/tls-acme: "true"
  #ingressClassName: nginx # Kubernetes >=1.19
  host: chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 4000m
    memory: 384Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

## Add extra configurations to the Portal via Environment Variables
## It is possible to specify new variables on project level
extraEnv: []

## Optional custom config map which can be
## used to override the generated configmap.
## Please note that helm values will not be 
## utilized in a custom configmap and thus setting
## those values may not have any effect.
existingConfigmap: ""

# Define additional volumes which can be
# added to the started pods
#extraVolumes:
#  - name: "extra"
#    mount:
#      mountPath: /Node/tmp/extra.conf
#      subPath: extra.conf
#    volume:
#      persistentVolumeClaim:
#        claimName: "extra"
#  - name: "extra2"
#    mount:
#      mountPath: /Node/tmp/extra2.conf
#    volume:
#      persistentVolumeClaim:
#        claimName: extra2

# Define extraVolumeMounts using existing volumes
# Can be used for persisting custom data in e.g. the shared portal volume
#extraVolumeMounts:
#  - mountPath: "/sharedfolder/custom"
#    subPath: "custom"
#    name: "shared"

persistence:
  enabled: true

  data:
    disablePersistentCache: false
    # existingClaim: ""
    annotations: {}
    spec:
        accessModes:
          - ReadWriteOnce
        # storageClassName: ""
        resources:
          requests:
            storage: 4Gi

  shared:
    # existingClaim: ""
    annotations: {}
    spec:
      accessModes:
        - ReadWriteMany
      # storageClassName: ""
      resources:
        requests:
          storage: 1Gi

#Liveness / Readiness Probe
portalProbeScheme: HTTP
portalProbePortName: http

liveness:
  period: 15
  timeout: 3
  failureThreshold: 2

readiness:
  period: 15
  timeout: 3
  failureThreshold: 2


# Use the config files provided with the values (mounting it)
portalConfigOverride: false

# Controls whether the session storage volume should be mounted.
# Set to `false` to disable the mounting of /portal/storage/framework/sessions.
disableSessionsMount: false

mesh:
  url: http://mesh.local:8080
  #secretName: "my-mesh-secret" ## Gentics Mesh API Key secret
  #apikey: "" ## Or pre-defined Gentics Mesh API KEY (if not set, the secret will be used)
