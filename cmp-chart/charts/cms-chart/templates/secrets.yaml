apiVersion: v1
kind: Secret
metadata:
  name: {{ template "cms.fullname" . }}
  labels:
    app: {{ template "cms.name" . }}
    chart: {{ template "cms.chart" . }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
  {{- if and $.Values.database.password (not $.Values.database.passwordSecret) (not $.Values.global.mariadb.enabled) }}
  database-password: {{ .Values.database.password | b64enc | quote }}
  {{- end }}
  {{- if and $.Values.cms.license.key (not $.Values.cms.license.secret) (not $.Values.global.license.key) }}
  licensekey: {{ .Values.cms.license.key | b64enc | quote }}
  {{- end }}
  {{- if not $.Values.cms.nodeUserPasswordSecret }}
  {{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "cms.fullname" .) }}
  {{- $nodeUserPassword := "" }}
  {{- if $.Values.cms.nodeUserPassword }}
    {{- $nodeUserPassword = $.Values.cms.nodeUserPassword }}
  {{- else if $existingSecret }}
    {{- $nodeUserPassword = index $existingSecret.data "node-user-password" | b64dec }}
  {{- else }}
    {{- $nodeUserPassword = randAlphaNum 24 }}
  {{- end }}
  node-user-password: {{ $nodeUserPassword | b64enc | quote }}
  {{- end }}
