apiVersion: v1
data:
  {{- if and $.Values.license.key (not $.Values.license.secret) }}
  licensekey: {{ .Values.license.key | b64enc | quote }}
  {{- else if $.Values.licenseKey }}
  ## only for backwards compatibility cmp < 8.2 - remove when Helmchart moved to portal repo
  licensekey: {{ .Values.licenseKey | b64enc | quote }}
  {{- end }}
kind: Secret
metadata:
  name: {{ template "gentics-portal.fullname" . }}-secrets
type: Opaque
