# Default values for gentics-portal.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

autoscaling:
  enabled: false
  maxReplicas: 10
  minReplicas: 3
  targetCPUUtilizationPercentage: 80

## PodDisruptionBudget — applied when replicaCount > 1 or autoscaling.enabled is true.
podDisruptionBudget:
  ## Minimum number/percentage of pods that must stay available during
  ## voluntary disruptions (node drains, cluster upgrades).
  minAvailable: "50%"
  ## Alternative to minAvailable — if set, it is used INSTEAD of minAvailable
  ## (Kubernetes allows only one of the two).
  # maxUnavailable: 1

image:
  # The portal | java has no pre-built image. A CI job needs to be setup to provide the image.
  # Reference the image which you build here.
  # registry and repository are combined to "registry/repository:tag";
  # global.imageRegistry (umbrella mirror override) takes precedence over registry.
  #registry: docker.gentics.com
  #repository: YOUR_ID/portal-PROJECT
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

license:
  key: null
  #optionally - specify the secret name where the license key is already stored (key need to be "licensekey")
  # secret:

# only for backwards compatibility cmp < 8.2 - remove when Helmchart moved to cms repo
licenseKey: null
licenseKeyPath: "/license"
licenseKeyFileName: "license.key"

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

podSecurityContext: {}

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

#podAnnotations:
#  - customAnnotation: "whatever"

service:
  type: ClusterIP
  port: 80
  useHttp2: false

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx # Kubernetes <1.19
    # kubernetes.io/tls-acme: "true"
  #ingressClassName: nginx # Kubernetes >=1.19
  host: chart-example.local
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 4000m
    memory: 384Mi
  requests:
    cpu: 200m
    memory: 128Mi

extraEnv:
  - name: JAVA_TOOL_OPTIONS
    value: "-Xms128m -Xmx128m"

nodeSelector: {}

tolerations: []

affinity: {}

# Default values for livenessProbe
livenessProbe:
  httpGet:
    path: /health/live
    port: monitoring
  timeoutSeconds: 1
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3

# Default values for readinessProbe
readinessProbe:
  httpGet:
    path: /health/ready
    port: monitoring
  timeoutSeconds: 1
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3

# Default values for startupProbe
startupProbe:
  httpGet:
    path: /health/live
    port: monitoring
  failureThreshold: 30
  periodSeconds: 2

## Optional custom config map which can be
## used to override the generated configmap.
## Please note that helm values will not be 
## utilized in a custom configmap and thus setting
## those values may not have any effect.
existingConfigmap: ""

mesh:
  ## Hostname and port of the Gentics Mesh instance the portal connects to.
  ## REQUIRED for standalone installs. Under the CMP umbrella chart both are
  ## auto-wired to the bundled Mesh service ("<release>-mesh":80) when left empty.
  host: ""
  port: null
  ## Whether to connect to Mesh via SSL.
  ssl: false
  project: demo
  apiKeyFromSecret: false
  #secretName: "my-mesh-secret" ## Gentics Mesh API Key secret
  #apikey: "" ## used if apiKeyFromSecret is false

monitoring:
  enabled: true
  jmxEnabled: true
  ignoreMeshReady: false

eventbus:
  pingInterval: 100
  retryTimeout: 5000

keycloak:
  enabled: false
  authUrl: http://localhost:8080/auth/  ## Auth url of the keycloak server
  realmName: demo                       ## Name of the keycloak realm
  publicClient: true                    ## Whether the client is public. If set to false, the client is confidential and the client secret must be set accordingly below.
  clientName: portal                    ## Name of the client that was created in keycloak for the portal
  clientSecret: ""                      ## The client secret. This can be copied from the Keycloak admin console: select the correct realm then clients -> CLIENT_NAME -> Credentials.
  realmPublicKey: ""                    ## Public key of the keycloak realm. This can be fetched from the keycloak JSON via https://your.keycloak/auth/realms/YOUR_REALM

auth: 
  callbackEndpoint: /auth/callback    ## Path to the endpoint that is used as callback URL by the OAuth2 server. Authentication will be disabled, when this is not set.
  checkEndpoint: /auth/check          ## Path to the endpoint that it used during the authentication process.
  insecureSSL: false                  ## Flag to allow insecure SSL connections to the OAuth2 server.
  loginEndpoint: /login               ## The path of the login endpoint.
  logoutEndpoint: /logout             ## Path to the API endpoint that can be called to start logout procedure.
  #logoutRedirect: ""                 ## Path to which the user will be redirected after logout. If not set, the user will be redirected to /.
  maxTempEntries: 1024                ## Maximum number of cached content specific authentication requirements
  #notAuthorisedPage: ""              ## Path to which the user will be redirected when accessing forbidden content. If not set, the user will get a response with status code 403 (Forbidden).
  redirectCookieMaxAge: 60            ## Maximum age of the authentication redirect cookie in seconds.

portal:
  #key: ""
  lang: "de"
  schemaPrefix: reference
  breadcrumbsLevel: 0
  compatibilityPreview: false

  nav:
    breadcrumbsLevel: 0
    expireTime: 15
    hiddenField: navhidden
    sortorderField: navsortorder
  caching:
    enabled: true
    static: false
    maxSize: 256
    staticMaxAge: 86400 ## Seconds
    expireTime: 60
    regionName: content
    config: config/cache.ccf
  server:
    port: 3000                ## The port the portal runs on. If this is different then the port in the serverUrl, a reverse proxy will be needed to resolve links correctly
    host: "0.0.0.0"           ## The host IP address the portal binds to. Note that by default the portal will bind to all interfaces. When a reverse proxy is used, it is advised to only bind to 127.0.0.1.
    url: ""                   ## The URL used for link resolving.
    eventPoolSize: 20
    workerPoolSize: 4
  path:
    static: data/static
    i18n: data/i18n
    templates: data/templates
    queries: data/queries


persistence:
  enabled: false

  ## Whether the shared Portal volume survives "helm uninstall".
  ## Unset: follows global.persistence.keepOnUninstall, defaulting to true (keep).
  ## Leave commented so the global umbrella switch stays effective.
  # keepOnUninstall: true

  # Volume for shared data
  # This volume should be a network volume (NFS) and will be shared across all instances
  shared:
    # Use existingClaim if you don't have a storage provisioner for your NFS
    # existingClaim: ""
    annotations: {}
    spec:
      accessModes:
        - ReadWriteMany
      # storageClassName: ""
      resources:
        requests:
          storage: 4Gi

