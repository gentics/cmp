{{- if .Values.mariadb.enabled }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-mariadb" .Release.Name) }}
{{- $rootPassword := .Values.mariadb.auth.rootPassword }}
{{- if not $rootPassword }}
{{- if $secret }}
{{- $rootPassword = index $secret.data "root-password" | default "" | b64dec }}
{{- else }}
{{- $rootPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mariadb
  labels:
    {{- include "cmp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
type: Opaque
data:
  root-password: {{ $rootPassword | b64enc | quote }}
{{- end }}
