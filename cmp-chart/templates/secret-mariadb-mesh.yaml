{{- if and .Values.global.mariadb.enabled .Values.mesh.enabled (not (((.Values.mesh).database).passwordSecret)) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-mesh-db" .Release.Name) }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 20 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mesh-db
  labels:
    {{- include "cmp.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
