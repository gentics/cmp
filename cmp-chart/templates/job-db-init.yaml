{{- if and .Values.mariadb.enabled (or .Values.cms.enabled .Values.mesh.enabled) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "cmp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-db-init
    spec:
      restartPolicy: OnFailure
      {{- with .Values.mariadb.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db-init
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              ROOT_PASS=$(cat /secrets/mariadb/root-password)
              MARIADB_HOST="{{ .Release.Name }}-mariadb"

              echo "Waiting for MariaDB at $MARIADB_HOST..."
              until mariadb -h "$MARIADB_HOST" -u root -p"$ROOT_PASS" -e "SELECT 1" 2>/dev/null; do
                echo "  not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "MariaDB is ready."

              {{- if and .Values.cms.enabled .Values.mariadb.enabled }}

              echo "Setting up CMS database..."
              CMS_PASS=$(cat /secrets/cms/password)
              mariadb -h "$MARIADB_HOST" -u root -p"$ROOT_PASS" \
                -e "CREATE DATABASE IF NOT EXISTS \`{{ ((.Values.cms.database).name) | default "cms" }}\`;" \
                -e "CREATE USER IF NOT EXISTS '{{ ((.Values.cms.database).username) | default "node" }}'@'%' IDENTIFIED BY '${CMS_PASS}';" \
                -e "GRANT ALL PRIVILEGES ON \`{{ ((.Values.cms.database).name) | default "cms" }}\`.* TO '{{ ((.Values.cms.database).username) | default "node" }}'@'%';" \
                -e "FLUSH PRIVILEGES;"
              echo "CMS database setup done."
              {{- end }}

              {{- if and .Values.mesh.enabled .Values.mariadb.enabled }}

              echo "Setting up Mesh database..."
              MESH_PASS=$(cat /secrets/mesh/password)
              mariadb -h "$MARIADB_HOST" -u root -p"$ROOT_PASS" \
                -e "CREATE DATABASE IF NOT EXISTS \`{{ ((.Values.mesh.database).name) | default "mesh" }}\`;" \
                -e "CREATE USER IF NOT EXISTS '{{ ((.Values.mesh.database).username) | default "mesh" }}'@'%' IDENTIFIED BY '${MESH_PASS}';" \
                -e "GRANT ALL PRIVILEGES ON \`{{ ((.Values.mesh.database).name) | default "mesh" }}\`.* TO '{{ ((.Values.mesh.database).username) | default "mesh" }}'@'%';" \
                -e "FLUSH PRIVILEGES;"
              echo "Mesh database setup done."
              {{- end }}

          volumeMounts:
            - name: mariadb-root
              mountPath: /secrets/mariadb
              readOnly: true
            {{- if .Values.cms.enabled }}
            - name: cms-db
              mountPath: /secrets/cms
              readOnly: true
            {{- end }}
            {{- if .Values.mesh.enabled }}
            - name: mesh-db
              mountPath: /secrets/mesh
              readOnly: true
            {{- end }}
      volumes:
        - name: mariadb-root
          secret:
            secretName: {{ .Release.Name }}-mariadb
        {{- if .Values.cms.enabled }}
        - name: cms-db
          secret:
            secretName: {{ .Release.Name }}-cms-db
        {{- end }}
        {{- if .Values.mesh.enabled }}
        - name: mesh-db
          secret:
            secretName: {{ .Release.Name }}-mesh-db
        {{- end }}
{{- end }}
