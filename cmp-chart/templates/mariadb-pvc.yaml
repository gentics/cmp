{{- if and .Values.global.mariadb.enabled (not .Values.mariadb.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-mariadb
  labels:
    {{- include "cmp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
  {{- with (include "gentics-common.pvcKeepAnnotations" (dict "root" . "local" (.Values.mariadb.persistence).keepOnUninstall)) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.mariadb.persistence.storageClass }}
  storageClassName: {{ .Values.mariadb.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mariadb.persistence.size }}
{{- end }}
