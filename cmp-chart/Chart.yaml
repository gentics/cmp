apiVersion: v2
name: cmp
description: Gentics CMP - Content Management Platform (Umbrella Chart)
type: application
# Chart version — bump this on every release of the umbrella chart
version: 8.6.0
# CMP application version this chart installs
appVersion: "8.6.0"
# Minimum supported Kubernetes version (autoscaling/v2 GA).
# The "-0" suffix is required so pre-release-style cluster versions
# (e.g. v1.28.3-eks-...) satisfy the constraint.
kubeVersion: ">=1.23.0-0"
home: https://www.gentics.com/Content.Node/cmp8/guides/
icon: https://www.gentics.com/genticscms/assets/images/gentics/gentics_logo.png
maintainers:
  - name: Gentics
dependencies:
  # Shared template library used by the sub-charts. Renders nothing itself.
  - name: gentics-common
    repository: "https://repo.gentics.com/repository/helm/"
    version: "0.2.0"
  - name: cms
    # TODO: replace with your published Helm repository URL
    repository: "https://repo.gentics.com/repository/helm/"
    version: "6.6.2"
    condition: cms.enabled
  - name: gentics-mesh
    alias: mesh
    # TODO: replace with your published Helm repository URL
    repository: "https://repo.gentics.com/repository/helm/"
    version: "3.3.2"
    condition: mesh.enabled
  - name: gentics-portal-java
    alias: portal-java
    # TODO: replace with your published Helm repository URL
    repository: "https://repo.gentics.com/repository/helm/"
    version: "3.6.2"
    condition: portal-java.enabled
  - name: gentics-portal-php
    alias: portal-php
    # TODO: replace with your published Helm repository URL
    repository: "https://repo.gentics.com/repository/helm/"
    version: "3.5.1"
    condition: portal-php.enabled

  # Monitoring stack (OpenTelemetry Collector, Prometheus, Loki, Tempo, Grafana,
  # Blackbox exporter). Installed when telemetry is on (global.otel.enabled=true),
  # unless monitoring.enabled=false (external mode). Helm uses the first condition
  # path that holds a boolean; templates/validation.yaml rejects
  # monitoring.enabled=true without telemetry.
  - name: grafana
    # Moved from grafana.github.io (deprecated there) to the community repository
    repository: "https://grafana-community.github.io/helm-charts"
    version: "14.4.1"
    condition: monitoring.enabled,global.otel.enabled
  - name: prometheus
    repository: "https://prometheus-community.github.io/helm-charts"
    version: "27.5.0"
    condition: monitoring.enabled,global.otel.enabled
  - name: loki
    repository: "https://grafana.github.io/helm-charts"
    version: "6.30.1"
    condition: monitoring.enabled,global.otel.enabled
  - name: tempo
    # Moved from grafana.github.io (deprecated there) to the community repository
    repository: "https://grafana-community.github.io/helm-charts"
    version: "3.2.1"
    condition: monitoring.enabled,global.otel.enabled
  - name: opentelemetry-collector
    repository: "https://open-telemetry.github.io/opentelemetry-helm-charts"
    version: "0.119.0"
    condition: monitoring.enabled,global.otel.enabled
  - name: prometheus-blackbox-exporter
    alias: blackbox-exporter
    repository: "https://prometheus-community.github.io/helm-charts"
    version: "9.5.0"
    condition: monitoring.enabled,global.otel.enabled
