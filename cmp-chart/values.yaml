## CMP Umbrella Chart — Default Values
##
## Each component section corresponds to the dependency alias defined in Chart.yaml.
## Values set here are merged with the sub-chart's own defaults.
## Sub-chart defaults remain active unless explicitly overridden here.

## Global values — shared across all enabled components.
## Sub-charts must be updated to read from .Values.global (see Path A migration).
global:
  ## Container image registry used by all components.
  ## Sub-charts will prefer this over their own image.repository prefix once global-aware.
  imageRegistry: "docker.gentics.com"

  ## Image pull secrets applied to all component pods.
  ## Replaces the per-chart image.pullSecret / imagePullSecrets fields.
  imagePullSecrets:
    - name: docker-gentics-com

  ## License key shared across all CMP components.
  ## When set, the umbrella chart creates a single Secret named "<release>-license"
  ## and each sub-chart is configured to reference it automatically.
  ## Leave empty if you manage the license secret externally or per-component.
  license:
    key: ""

  ## MariaDB integration flag.
  ## Must be set to true together with mariadb.enabled to activate auto-wiring of
  ## database host and credentials in CMS and Mesh sub-charts.
  mariadb:
    enabled: true

  ## Example installation flag.
  example:
    enabled: false
    ## Fixed portal-java image used when example is active.
    portalJavaImage:
      repository: docker.gentics.com/apps/portal-java-reference
      tag: patrick

# -----------------------------------------------------------------------
# CMS
# -----------------------------------------------------------------------
cms:
  enabled: true
  image:
    repository: "docker.gentics.com/gentics/cms"
    tag: 6.4.3
  #database:
  #  host: mariadb
  #  password: pass

  cms:
    preUpgrade:
      enabled: false

  # for all available options, please check the gentics/cms chart


# -----------------------------------------------------------------------
# Mesh
# -----------------------------------------------------------------------
mesh:
  enabled: true

  image:
    repository: docker.gentics.com/andp/mesh-mariadb
    tag: andp-8.3.11


  #database:
  #  host: mariadb
  #  port: 3306
  #  name: mesh
  #  username: db-user
  #  password: db-pw

  # for all available options, please check the gentics/gentics-mesh chart

# -----------------------------------------------------------------------
# Portal | Java
# -----------------------------------------------------------------------
portal-java:
  enabled: false
  image:
    repository: docker.gentics.com/YOUR_ID/portal-PROJECT
    tag: x.x.x

  mesh:
    apiKeyFromSecret: true

  licenseKeyPath: "/tmp"

  # for all available options, please check the gentics/gentics-portal-java chart

# -----------------------------------------------------------------------
# MariaDB (optional — disable if you provide an external database)
# -----------------------------------------------------------------------
mariadb:
  enabled: true

  image:
    repository: docker.io/library/mariadb
    tag: "11"
    pullPolicy: IfNotPresent
  ## imagePullSecrets:
  ##   - name: my-registry-secret

  auth:
    ## Root password. Leave empty to generate a random password on install.
    ## The generated password is persisted in the Secret and reused on upgrades.
    rootPassword: ""

  persistence:
    ## Storage size for the MariaDB data volume.
    size: 5Gi
    ## storageClass: ""   # leave empty to use the cluster default
    ## Use a pre-created PVC instead of creating one via volumeClaimTemplates.
    ## existingClaim: ""

  service:
    type: ClusterIP
    port: 3306

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  podSecurityContext: {}

  securityContext: {}

  ## Optional custom MariaDB configuration appended as /etc/mysql/conf.d/custom.cnf.
  config: |
    [mariadb]
      max_connections = 300
      innodb_snapshot_isolation = OFF
       


