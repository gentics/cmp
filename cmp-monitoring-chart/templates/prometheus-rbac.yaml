{{- if .Values.prometheus.rbac.create }}
# Prometheus chart has rbac.create=false to prevent ClusterRole creation.
# We create namespace-scoped Role + RoleBinding here instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-prometheus-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: cmp-monitoring
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-prometheus-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: cmp-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-prometheus-server
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prometheus-server
    namespace: {{ .Release.Namespace }}
{{- end }}
