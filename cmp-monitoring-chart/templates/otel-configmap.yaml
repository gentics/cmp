apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-monitoring-otelcol-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: cmp-monitoring
data:
  relay: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
    exporters:
      otlp/tempo:
        endpoint: cmp-monitoring-tempo:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://cmp-monitoring-loki:3100/otlp
      prometheus:
        endpoint: 0.0.0.0:8889
    extensions:
      health_check:
        endpoint: "${env:MY_POD_IP}:13133"
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
