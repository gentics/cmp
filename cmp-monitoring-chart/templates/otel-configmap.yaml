apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cmp-monitoring.otelConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: cmp-monitoring
data:
  relay: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
    exporters:
      otlp/tempo:
        endpoint: {{ include "cmp-monitoring.tempoHost" . }}:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://{{ include "cmp-monitoring.lokiHost" . }}:3100/otlp
      prometheus:
        endpoint: 0.0.0.0:8889
    extensions:
      health_check:
        use_v2: true
        component_health:
          include_permanent_errors: false
          include_recoverable_errors: true
          recovery_duration: 5m
        http:
          endpoint: "${env:MY_POD_IP}:13133"
          status:
            enabled: true
            path: "/"
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
