# =============================================================================
# OpenShift overlay: helm upgrade --install ... -f values-openshift.yaml
#
# The restricted SCC assigns UIDs and fsGroup from the namespace range and rejects
# any other value, so the fixed IDs from the sub-chart defaults must be removed.
# This only works when passed with -f (or --set), not from the chart's values.yaml.
# =============================================================================
grafana:
  securityContext:
    runAsUser: ~
    runAsGroup: ~
    fsGroup: ~

prometheus:
  server:
    securityContext:
      runAsUser: ~
      runAsGroup: ~
      fsGroup: ~

loki:
  loki:
    podSecurityContext:
      runAsUser: ~
      runAsGroup: ~
      fsGroup: ~

tempo:
  securityContext:
    runAsUser: ~
    runAsGroup: ~
    fsGroup: ~

blackbox-exporter:
  securityContext:
    runAsUser: ~
    runAsGroup: ~
