apiVersion: v2
name: cmp-monitoring
description: Gentics CMP monitoring stack for Kubernetes and OpenShift
type: application
version: 1.0.0

dependencies:
  - name: grafana
    version: "8.9.1"
    repository: https://grafana.github.io/helm-charts
    alias: grafana

  - name: prometheus
    version: "27.5.0"
    repository: https://prometheus-community.github.io/helm-charts
    alias: prometheus

  - name: loki
    version: "6.30.1"
    repository: https://grafana.github.io/helm-charts
    alias: loki

  - name: tempo
    version: "1.24.4"
    repository: https://grafana.github.io/helm-charts
    alias: tempo

  - name: opentelemetry-collector
    version: "0.119.0"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: opentelemetry-collector

  - name: prometheus-blackbox-exporter
    version: "9.5.0"
    repository: https://prometheus-community.github.io/helm-charts
    alias: blackbox-exporter
