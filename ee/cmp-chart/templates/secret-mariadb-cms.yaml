{{- if and .Values.global.mariadb.enabled .Values.cms.enabled (not (((.Values.cms).database).passwordSecret)) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-cms-db" .Release.Name) }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 20 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-cms-db
  labels:
    {{- include "cmp.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
