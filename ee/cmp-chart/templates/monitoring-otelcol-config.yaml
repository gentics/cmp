{{- /*
Pipeline config of the bundled OpenTelemetry Collector
(opentelemetry-collector.configMap.existingName): OTLP in, traces to Tempo,
logs to Loki, metrics to a Prometheus scrape endpoint on :8889.
Metrics of Portal | PHP: every PHP request exports its own metrics with delta
temporality, the prometheus exporter needs cumulative ones.
- transform/php_instance gives every PHP worker its own series
  (service.instance.id = <pod>/<pid>): delta_to_cumulative drops samples that arrive
  out of order, which happens when several workers write the same series.
- delta_to_cumulative adds up the deltas per series. Cumulative metrics (Java
  components) pass through unchanged. It keeps its state in memory, so all metrics of
  a pod must reach the same Collector instance.
*/ -}}
{{- if include "cmp.monitoringEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otelcol-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmp.labels" . | nindent 4 }}
    app.kubernetes.io/component: opentelemetry-collector
data:
  relay: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      transform/php_instance:
        metric_statements:
          - context: resource
            conditions:
              - attributes["telemetry.sdk.language"] == "php" and attributes["k8s.pod.name"] != nil and attributes["process.pid"] != nil
            statements:
              - set(attributes["service.instance.id"], Concat([attributes["k8s.pod.name"], attributes["process.pid"]], "/"))
      # Type name in Collector v0.163 (deprecated alias: deltatocumulative)
      delta_to_cumulative: {}
    # otlp_grpc / otlp_http: exporter names since Collector v0.144.0 (formerly otlp / otlphttp)
    exporters:
      otlp_grpc/tempo:
        endpoint: {{ .Release.Name }}-tempo:4317
        tls:
          insecure: true
      otlp_http/loki:
        endpoint: http://{{ .Release.Name }}-loki:3100/otlp
      prometheus:
        endpoint: 0.0.0.0:8889
    extensions:
      health_check:
        endpoint: "${env:MY_POD_IP}:13133"
    service:
      extensions: [health_check]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, transform/php_instance, delta_to_cumulative, batch]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/loki]
{{- end }}
