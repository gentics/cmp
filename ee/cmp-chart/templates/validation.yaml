{{- /*
Cross-value consistency checks for the umbrella chart.
This template renders nothing — it only fails fast on inconsistent configurations.
*/ -}}
{{- if and .Values.global.mesh.enabled (not .Values.mesh.enabled) }}
{{- fail "Inconsistent values: global.mesh.enabled is true but mesh.enabled is false. Either enable the bundled Mesh (mesh.enabled=true) or set global.mesh.enabled=false and configure portal-java.mesh.host/port to point at your external Mesh." }}
{{- end }}

{{- /*
OpenTelemetry and the bundled monitoring stack.
*/ -}}
{{- $otel := (.Values.global).otel | default dict }}
{{- $monitoringEnabled := include "cmp.monitoringEnabled" . }}
{{- $monitoringValue := (.Values.monitoring | default dict).enabled }}

{{- /* The stack only makes sense with telemetry; Helm cannot AND two conditions. */ -}}
{{- if and (kindIs "bool" $monitoringValue) $monitoringValue (not $otel.enabled) }}
{{- fail "monitoring.enabled=true requires telemetry: the monitoring stack only receives data from the CMP components when global.otel.enabled=true.\n      Fix: --set global.otel.enabled=true (and leave monitoring.enabled unset)" }}
{{- end }}

{{- /*
Without the bundled stack, every component with telemetry on needs an endpoint;
otherwise the agent would export to a Collector that does not exist.
*/ -}}
{{- if not $monitoringEnabled }}
{{- range $component := list "cms" "mesh" "portal-java" }}
{{- if include "cmp.componentOtelEnabled" (dict "root" $ "component" $component) }}
{{- if not (or (dig "otel" "endpoint" "" (index $.Values $component | default dict)) $otel.endpoint) }}
{{- fail (printf "Telemetry is on for %s, but the bundled monitoring stack is not installed and no OTLP endpoint is set.\n      Fix (any one):\n        --set global.otel.endpoint=http://<collector>:4318   (external mode, e.g. another CMP's Collector: http://<release>-opentelemetry-collector.<namespace>.svc:4318)\n        --set %s.otel.endpoint=http://<collector>:4318\n        install the bundled stack: --set global.otel.enabled=true and leave monitoring.enabled unset" $component $component) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
On OpenShift the restricted SCC rejects the fixed UIDs from the monitoring
sub-chart defaults. They stay set unless the commented "OpenShift" securityContext
lines of values.yaml are set (to ~), or if Helm is older than 3.17, which ignores
null overrides for sub-chart values.
*/ -}}
{{- if and $monitoringEnabled (.Capabilities.APIVersions.Has "security.openshift.io/v1") (((.Values.grafana).securityContext).runAsUser) }}
{{- fail (printf "OpenShift detected, but the monitoring stack still has fixed UIDs. Set the commented \"OpenShift\" securityContext lines (runAsUser/runAsGroup/fsGroup: ~) of grafana, prometheus, loki, tempo and blackbox-exporter from the chart's values.yaml in your values file, and use Helm 3.17 or newer (current Helm: %s)." .Capabilities.HelmVersion.Version) }}
{{- end }}

{{- /*
Requirements for the example installation. Every problem is collected before
failing so one "helm install" reports the full list — fixing them one error per
attempt is a poor first experience for what is meant to be the easy path.
*/ -}}
{{- if .Values.global.example.enabled }}
{{- $problems := list }}
{{- $portalJava := (index .Values "portal-java") | default dict }}

{{- /*
Helm resolves dependency conditions before any template renders, so the example
flag cannot switch portal-java on by itself.
*/ -}}
{{- if not $portalJava.enabled }}
{{- $problems = append $problems "portal-java.enabled is false — the example portal would not be deployed at all. Helm resolves dependency conditions before templates render, so global.example.enabled cannot switch the sub-chart on by itself.\n      Fix: --set portal-java.enabled=true" }}
{{- end }}

{{- /*
A license must be reachable, but not necessarily as a literal key: GitOps/Argo CD
installs reference a pre-created Secret instead of putting the key in values.
Accept either route so the check does not reject a working deployment.
*/ -}}
{{- $globalLicense := .Values.global.license | default dict }}
{{- $portalLicense := $portalJava.license | default dict }}
{{- if not (or $globalLicense.key $portalLicense.secret $portalLicense.key) }}
{{- $problems = append $problems "No CMP license is configured — the example portal, CMS and Mesh all need one.\n      Fix (either route):\n        --set global.license.key=<your-license-key>   (umbrella creates the \"<release>-license\" Secret)\n        --set portal-java.license.secret=<secret-name> (Argo CD/GitOps: reference a pre-created Secret holding key \"licensekey\")" }}
{{- end }}

{{- $serverUrl := ((($portalJava.portal | default dict).server) | default dict).url }}
{{- if not $serverUrl }}
{{- $problems = append $problems "portal-java.portal.server.url is empty — the portal needs its externally reachable URL to resolve links correctly.\n      Fix: --set portal-java.portal.server.url=https://portal.example.com" }}
{{- end }}

{{- $portalMesh := $portalJava.mesh | default dict }}
{{- $meshValues := .Values.mesh | default dict }}
{{- if and $meshValues.enabled $portalMesh.apiKeyFromSecret (not $portalMesh.secretName) }}
{{- if not $meshValues.generateApiKey }}
{{- $problems = append $problems "mesh.generateApiKey is false, but the example portal reads its Mesh API key from the \"<release>-mesh-secret\" Secret (portal-java.mesh.apiKeyFromSecret=true). That Secret is always rendered but stays EMPTY unless the key-generating Job runs, so the portal pod would hang in CreateContainerConfigError.\n      Fix (any one):\n        --set mesh.generateApiKey=true                  (Mesh issues the key on install; create-once, safe to leave on)\n        --set portal-java.mesh.secretName=<secret-name> (reference a Secret you manage, key \"apikey\")\n        --set portal-java.mesh.apiKeyFromSecret=false --set portal-java.mesh.apikey=<key>" }}
{{- end }}
{{- end }}

{{- if $problems }}
{{- $list := "" }}
{{- range $i, $p := $problems }}{{ $list = printf "%s\n  %d. %s\n" $list (add1 $i) $p }}{{ end }}
{{- fail (printf "\n\nThe example installation (global.example.enabled=true) cannot be installed — %d value(s) missing:\n%s\nSee the \"example\" section in values.yaml for details.\n" (len $problems) $list) }}
{{- end }}
{{- end }}
