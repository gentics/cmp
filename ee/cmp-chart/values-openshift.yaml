# =============================================================================
# OpenShift overlay: helm upgrade --install ... -f values-openshift.yaml
# Requires Helm 3.17 or newer.
#
# The restricted SCC assigns UIDs and fsGroup from the namespace range and rejects
# any other value, so the fixed IDs from the monitoring sub-chart defaults must be
# removed. This only works when passed with -f (or --set), not from the chart's
# values.yaml, and older Helm versions ignore it; templates/validation.yaml stops
# the install on OpenShift when the UIDs are still set.
# Only relevant when the bundled monitoring stack is installed.
# =============================================================================
grafana:
  securityContext:
    runAsUser: ~
    runAsGroup: ~
    fsGroup: ~

prometheus:
  server:
    securityContext:
      runAsUser: ~
      runAsGroup: ~
      fsGroup: ~

loki:
  loki:
    podSecurityContext:
      runAsUser: ~
      runAsGroup: ~
      fsGroup: ~

tempo:
  securityContext:
    runAsUser: ~
    runAsGroup: ~
    fsGroup: ~

blackbox-exporter:
  securityContext:
    runAsUser: ~
    runAsGroup: ~
